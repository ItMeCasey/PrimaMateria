# Prima Materia settings. Edit a value and restart the game or server. Delete a line to restore its default.

# Shakes needed to sift one block with a mesh of speed 1.0.
sieve.shakes_per_block=8

# Sieves next to each other are shaken and refilled together.
sieve.link=true

# How far linking reaches in blocks around a sieve (1 is a 3 by 3 square; 1 to 3).
sieve.link_radius=1

# Multiplies every sifting chance.
sieve.drop_multiplier=1.0

# Chance of one extra result per hammer tier above 2.
hammer.bonus_per_tier=0.1

# Turns a windup drive stores.
drive.windup_max_turns=48

# Ticks between shakes of a windup drive.
drive.windup_ticks_per_shake=8

# Ticks between shakes of a furnace drive.
drive.furnace_ticks_per_shake=4

# Ticks between shakes of a powered drive.
drive.powered_ticks_per_shake=2

# Energy (FE) a powered drive uses per shake.
drive.powered_fe_per_shake=40

# Energy (FE) a powered drive stores.
drive.powered_capacity=10000

# Drive shakes an auto hammer needs to crush one block.
auto_hammer.strokes_per_block=6

# Ticks for a barrel under open sky to gain 1 mB of water. 0 switches dew off.
barrel.dew_ticks_per_mb=4

# How much faster a barrel fills in rain.
barrel.rain_multiplier=8

# Multiplies compost, soak, steep and grow times.
barrel.time_multiplier=1.0

# mB a crucible melts per tick for each point of heat below it.
crucible.mb_per_tick_per_heat=2

# When the start island is placed: preset_only (Void Island worlds), always, never.
start.island=preset_only

# Animation level: full, reduced or off. Client side.
client.animations=full

# Show sifting dust and falling fines. Client side.
client.particles=true

# Blocks within which moving sieves are animated; half of it is the full detail range. Client side.
client.animation_distance=48

# Most sieve shake sounds played in one tick. Client side.
client.sounds_per_tick=4
