plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-mc${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Shared code lives in ../common (Minecraft-free logic and the config) and ../version-26.2 (everything that touches the game).
sourceSets {
    test {
        java.srcDir '../common/src/test/java'
    }
    main {
        java.srcDir '../version-26.2/src/main/java'
        java.srcDir "../common/src/main/java"
        resources.srcDir '../version-26.2/src/main/resources'
        resources.srcDir "../common/src/main/resources"
    }
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
            if (project.hasProperty('devTools')) { systemProperty 'primamateria.dev', 'true' }
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// neoforge.mods.toml is a template: this fills in its ${} values from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// -PwindowSize=1904x1041 opens the dev client at that size (the screenshot checks need the same layout every run).
if (project.hasProperty('windowSize')) {
    neoForge {
        runs {
            client {
                programArgument '--width'
                programArgument project.property('windowSize').split('x')[0]
                programArgument '--height'
                programArgument project.property('windowSize').split('x')[1]
            }
        }
    }
}

// Unit tests for the shared logic; they need no running game.
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.mozilla:rhino:1.7.15"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// BEI (Barely Enough Items) is an optional recipe viewer of ours. Only its API is compiled against, from the jar in libs;
// the plugin class is never loaded unless BEI is installed.
dependencies {
    compileOnly files('libs/bei-neoforge-26.2-2026.11.7-api.jar')
}

// Development tools (headless self test, screenshot tour) live in src/dev folders and only build with -PdevTools, so a normal
// build and the release jars never contain them.
if (project.hasProperty('devTools')) {
    sourceSets.main.java.srcDir '../version-26.2/src/dev/java'
    sourceSets.main.java.srcDir 'src/dev/java'
}

// -PbeiJar=<path> adds a BEI jar to the dev client (used for the recipe transfer check).
if (project.hasProperty('beiJar')) {
    dependencies {
        runtimeOnly files(project.property('beiJar'))
    }
}

// --- Optional integrations ---
// Compile-only access to the optional mods and, with -Pviewers=<names>, dev-client runtime access. Nothing here ships: the
// release jar holds only our classes, and every integration loads only when the other mod is installed. Names: smwti, bei, modjs, jei, mezz, rei, architectury, cloth, jade.
// -Pviewers=bei,smwti,modjs adds those mods to a dev run (modjs for the script bridge check).
repositories {
    def imcUser = System.getenv('IMC_MAVEN_USER') ?: project.findProperty('imcMavenUser')
    def imcPass = System.getenv('IMC_MAVEN_PASSWORD') ?: project.findProperty('imcMavenPassword')
    if (imcUser && imcPass) {
        maven {
            name = 'ItMeCasey mirror'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
            content { includeGroup 'curse.maven' }
        }
    }
    maven {
        name = 'Cursemaven (fallback)'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

def viewerFiles = [smwti: 'smwti-1781438:9602352', bei: 'bei-1783910:9602396', modjs: 'modjs-1783874:9599425', jei: 'jei-238222:9352384', mezz: 'mezzconfig-1689768:9527943', rei: 'roughly-enough-items-310111:8271756', architectury: 'architectury-api-419699:9111233', cloth: 'cloth-config-348521:8269700', jade: 'jade-324717:8755115']
dependencies {
    compileOnly "curse.maven:${viewerFiles.smwti}"
    compileOnly "curse.maven:${viewerFiles.jei}"
    compileOnly "curse.maven:${viewerFiles.rei}"
    compileOnly "curse.maven:${viewerFiles.architectury}"
    compileOnly "curse.maven:${viewerFiles.cloth}"
    compileOnly "curse.maven:${viewerFiles.jade}"
}
if (project.hasProperty('viewers')) {
    dependencies {
        project.property('viewers').split(',').each { name -> runtimeOnly "curse.maven:${viewerFiles[name.trim()]}" }
    }
}
